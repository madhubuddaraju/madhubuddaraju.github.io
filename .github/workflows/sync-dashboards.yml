name: Sync project dashboards

# Each project repo rebuilds its dashboard (docs/index.html) on its own schedule.
# This job copies the latest version of each into this site, so every dashboard is served at
# madhubuddaraju.github.io/<project>/ and stays current.
on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest dashboards
        run: |
          set -euo pipefail
          for repo in respiratory-surveillance climate-emissions-tracker readmission-risk-ml ecommerce-data-pipeline consumer-complaints-nlp drug-label-rag hospital-quality-warehouse nyc-subway-live; do
            mkdir -p "$repo"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/madhubuddaraju/$repo/main/docs/index.html" -o "$repo/index.html.new"
            # only accept a real page (guards against an empty or error response)
            if grep -q "</html>" "$repo/index.html.new"; then mv "$repo/index.html.new" "$repo/index.html"; else rm "$repo/index.html.new"; fi
          done
          # the hospital warehouse also publishes its dbt docs (lineage graph)
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/madhubuddaraju/hospital-quality-warehouse/main/docs/lineage.html" -o lineage.html.new
          if grep -q "</html>" lineage.html.new; then mv lineage.html.new hospital-quality-warehouse/lineage.html; else rm lineage.html.new; fi
          # the drug label search also needs its browser index
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/madhubuddaraju/drug-label-rag/main/docs/corpus.json" -o corpus.json.new
          if python3 -c "import json; json.load(open('corpus.json.new'))"; then mv corpus.json.new drug-label-rag/corpus.json; else rm corpus.json.new; fi
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "Dashboards already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync project dashboards $(date -u +%Y-%m-%d)"
          git push
